name: ACR Multi-Arch Build and Push

permissions:
  contents: write

on:
  push:
    branches: [ "main"]
  workflow_dispatch:

env:
  # The name of the repository/image within ACR.
  IMAGE_REPO_NAME: dji-log-parser
  # Set the desired platforms
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GitHub Packages (ghcr.io)

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_RG_ASL_CUS_CREDENTIALS }}
          
      - name: 🐳 Docker Login to ACR
        run: |
          set -euo pipefail
          access_token=$(az account get-access-token --query accessToken -o tsv)
          refresh_token=$(curl https://${{env.acr-name}}/oauth2/exchange -v -d "grant_type=access_token&service=${{env.acr-name}}&access_token=$access_token" | jq -r .refresh_token)
          docker login -u 00000000-0000-0000-0000-000000000000 --password-stdin "${{env.acr-name}}" <<< "$refresh_token"

      - name: 🔨 Set up QEMU
        # Required to run emulation for ARM/other architectures
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ Set up Docker Buildx
        # Enables multi-arch builds
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Define Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO_NAME }}
          tags: |
            type=sha,format=true,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: 🚀 Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/Dockerfile 
          push: true
          provenance: mode=min # use min for now since max could store some build env vars
          sbom: true # Generate SBOM
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ env.PLATFORMS }}
          cache-from: type=gha # Use GitHub Actions cache for faster builds
          cache-to: type=gha,mode=max
          secrets: |
            "asl_gha_user=${{ secrets.asl_gha_pat }}"
            "asl_pipeline_read_packages_token=${{ secrets.asl_pipeline_read_packages_token }}"

      - name: Azure Logout
        if: always()
        run: >
          az logout

